<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'sha256-JfTWX/ZUkInNO0/lKV2NO8rmKIPWSUu4FJ+8q3rgggc='; script-src 'sha256-Hegbhs7mGRODwceaL22FpRgf18oloEr21Qt8QRN2wac='; base-uri 'none'; form-action 'none'">
<title>Page not found</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7fb;--fg:#1b1d2a;--muted:#555a6e;--accent:#4b3fe0;--accent-fg:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#12131c;--fg:#eceef8;--muted:#a3a8bf;--accent:#8c82ff;--accent-fg:#12131c}}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{box-sizing:border-box;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
h1{font-size:2rem;margin:.25em 0}
p{color:var(--muted);max-width:32ch;margin:.25em 0 1.5em}
.big{font-size:4rem;line-height:1;margin:0}
a{display:inline-block;min-height:44px;box-sizing:border-box;padding:10px 22px;border-radius:999px;background:var(--accent);color:var(--accent-fg);font-weight:600;text-decoration:none}
a:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
</style>
</head>
<body>
<main>
<p class="big" aria-hidden="true">404</p>
<h1>Nothing here</h1>
<p>This page does not exist. The link may be old or mistyped.</p>
<a id="home" href="./">Back to the app</a>
</main>
<script>
(function(){var p=location.pathname.split('/').filter(Boolean),b='/';if(/\.github\.io$/i.test(location.hostname)&&p.length){b='/'+p[0]+'/';}document.getElementById('home').setAttribute('href',b);})();
</script>
</body>
</html>
